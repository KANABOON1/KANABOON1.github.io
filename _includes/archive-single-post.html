{% include base_path %}

<div class="blog-card">
    <div class="blog-content">
      <h2 class="blog-title">
        <a href="{{ post.url | relative_url }}" class="blog-link-wrapper">
          {{ post.title }}
        </a>
      </h2>

      <p class="blog-excerpt">
        {% if post.description %}
          {{ post.description }}
        {% else %}
          {{ post.excerpt | strip_html | truncatewords: 30 }} {% endif %}
      </p>

      <p class="blog-meta">
        <span class="meta-item"><i class="fas fa-calendar-days" aria-hidden="true"></i>{{ post.date | date: "%B %d, %Y" }}</span>
        <span class="meta-item"><i class="fas fa-clock" aria-hidden="true"></i>{{ post.read_time }} min read</span>
      </p>
    </div>
</div>
